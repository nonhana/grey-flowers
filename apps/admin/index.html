<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Grey Flowers Admin</title>

    <!--
      JetBrains Mono 已自托管（见 src/main.tsx）。这里只留 CJK 黑体。

      Noto Sans SC 不自托管是量出来的决定，不是省事：@fontsource 把整个简体
      中文子集打成单个 1.3 MB 的 woff2，每个字重一份；Google 把同一套字形切成
      上百个 unicode-range 分片，一屏中文只会真的下载其中三五片、几十 KB。
      「移动端也要能长写」这条答案指向的是流量与首字时间，那就不能为了自托管
      这个名义把 2.6 MB 压到手机上。断网时 font-family 会落到 PingFang SC /
      Microsoft YaHei / Noto Sans CJK —— 仍然是黑体，纸面不会变成系统衬线。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap"
    />

    <script>
      // 主题必须在首帧之前落地，否则深色用户会先吃一帧白闪。
      // 与 src/app/theme/theme-provider.tsx 共用 'gf-admin-theme' 这个键。
      (function () {
        try {
          var mode = localStorage.getItem('gf-admin-theme') || 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? 'dark' : 'light';
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <!--
      GREY FLOWERS ADMIN · DIRECTION CONTRACT

      THESIS: 后台是一间排字房。字盘与纸两种物质，永不混淆。它拒绝的品类默认，是把
      导航、列表、控件与正文一起塞进同一种「圆角 + 灰边 + 软阴影」卡片的匀质浆糊。

      OWN-WORLD: 承袭 Grey Flowers 已确认身份 —— petal-blue 单一强调色、Noto Sans SC
      与 JetBrains Mono、雾化中性、圆润不玩具化。新增的是 register 分层：
      字盘层按格对齐、表格化数字、紧行高、拉丁数据走等宽；纸层黑体、68ch、行高 1.9、
      无边框切割的抬升面。控制台内不铺网格底纹，网格只留在 auth stage —— 那里品牌才在说话。

      STORY: 操作者冷启动 → 一眼读到当前状态 → 完成她来做的那一件事 → 离开。
      全程不需要把任何一个标签读第二遍。

      FIRST VIEWPORT: 左侧 264px 通栏字盘侧栏（品牌块 / 与导航明确分离的新建动作键 /
      分组导航 / 底部账户块），右侧内容区。工作区的 inspector 是任何断点都可召回、
      可消失的 sheet，推入时挤压纸面页边而不改变行宽。移动端为底部拇指动作栏 +
      键盘感知的满高纸面。

      FORM: Rail + Sheet；共鸣序列第 4 项；concept-seed key e201f6c7。

      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
