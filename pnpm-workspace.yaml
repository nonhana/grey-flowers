packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true
minimumReleaseAge: 0

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
  vue-demi: true

catalogMode: prefer
cleanupUnusedCatalogs: true

shellEmulator: true
publicHoistPattern:
  - '*workbox*'
trustPolicy: no-downgrade
trustPolicyExclude:
