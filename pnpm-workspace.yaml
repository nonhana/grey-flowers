packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true
minimumReleaseAge: 0

allowBuilds:
  '@grey-flowers/db@file:packages/db': false
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  better-sqlite3: true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
  vue-demi: true

catalogMode: prefer
cleanupUnusedCatalogs: true

shellEmulator: true
publicHoistPattern:
