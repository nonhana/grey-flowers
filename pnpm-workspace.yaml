packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  vue-demi: true

catalogMode: prefer
cleanupUnusedCatalogs: true

shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - undici-types@6.21.0
  - semver@6.3.1
  - resend@6.18.1

catalog:
  '@types/node': 24.13.3
  eslint-plugin-better-tailwindcss: ^4.7.0
  oxfmt: ^0.61.0
  oxlint: ^1.76.0
  oxlint-tsgolint: ^7.0.2001
  typescript: 6.0.3

